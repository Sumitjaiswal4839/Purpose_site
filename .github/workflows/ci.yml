name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Generate Prisma Client
      run: npx prisma generate
      
    - name: Run Linter
      run: npm run lint
      
    - name: Run Tests
      run: npm test
      
    - name: Build Next.js Application
      run: npm run build
      env:
        # Mock environment variables needed for build
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/purpose_site
        JWT_SECRET: dummy_secret_for_build
        ENCRYPTION_SECRET_KEY: 12345678901234567890123456789012
